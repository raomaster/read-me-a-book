<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<!-- iOS specific meta tags -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Leeme" />
		
		<!-- iOS icons -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-180.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icon-180.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="%sveltekit.assets%/icon-192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="%sveltekit.assets%/icon-512.png" />
		
		<!-- Theme color for iOS status bar -->
		<meta name="theme-color" content="#4f46e5" />
		<meta name="msapplication-TileColor" content="#4f46e5" />
		
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
